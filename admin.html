<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель — макарик</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Защита страницы: проверяем, вошел ли администратор -->
    <script>
        if (localStorage.getItem('isAdminLoggedIn') !== 'true') {
            // Если не авторизован — отправляем на страницу логина
            window.location.href = 'login.html';
        }
    </script>
</head>
<body>
    <div class="admin-container">
        <header class="admin-header">
            <h1>Панель управления Макарика</h1>
            <button onclick="logout()" class="btn-logout">Выйти</button>
        </header>

        <main class="admin-content">
            <p>Добро пожаловать в защищенную зону администратора!</p>
            <!-- Сюда вы можете добавить ваши элементы управления или формы -->
        </main>
    </div>

    <script>
        // Функция выхода из аккаунта
        function logout() {
            localStorage.removeItem('isAdminLoggedIn');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
