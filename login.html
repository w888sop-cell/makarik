<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в админку — макарик</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <h2>Вход для администратора</h2>
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="input-group">
                <label for="username">Логин:</label>
                <input type="text" id="username" required placeholder="Введите логин">
            </div>
            <div class="input-group">
                <label for="password">Пароль:</label>
                <input type="password" id="password" required placeholder="Введите пароль">
            </div>
            <button type="submit" class="btn">Войти</button>
            <p id="errorMsg" style="color: red; margin-top: 10px; display: none;"></p>
        </form>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault(); // Чтобы страница не перезагружалась

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            // Проверяем наши данные
            if (user === 'prob1' && pass === 'prob999') {
                // Запоминаем вход в памяти браузера
                localStorage.setItem('isAdminLoggedIn', 'true');
                // Переходим на страницу админки
                window.location.href = 'admin.html';
            } else {
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'Неверный логин или пароль!';
            }
        }
    </script>
</body>
</html>
