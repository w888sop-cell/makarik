<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Макар Сапоженко</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">Макар Сапоженко</div>
        <nav>
            <a href="index.html">Главная</a>
            <a href="admin.html">Админ</a>
        </nav>
    </header>

    <main style="max-width: 800px; margin: 20px auto; padding: 20px; text-align: center;">
        
        <!-- Блок для фотографии, которая загружается из админки -->
        <div style="margin: 20px 0;">
            <img id="mainPhoto" src="" alt="Фото Макара" style="max-width: 100%; max-height: 400px; display: none; border-radius: 8px; margin: 0 auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
        </div>

        <h1>Макар Сапоженко Артурович</h1>
        <p id="mainDesc" style="color: #555; font-size: 18px; margin-top: 10px;"></p>
        
    </main>

    <!-- Скрипт автоматического подтягивания данных из админки -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            // Загружаем картинку
            const savedImage = localStorage.getItem('savedImage');
            const imgElement = document.getElementById('mainPhoto');
            if (savedImage && imgElement) {
                imgElement.src = savedImage;
                imgElement.style.display = 'block';
            }

            // Загружаем описание (если меняли в админке)
            const savedDesc = localStorage.getItem('savedDesc');
            const descElement = document.getElementById('mainDesc');
            if (savedDesc && descElement) {
                descElement.textContent = savedDesc;
            }
        });
    </script>
</body>
</html>
